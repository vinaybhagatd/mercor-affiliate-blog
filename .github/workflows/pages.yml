name: MABS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run BatchCreateBlogs.ps1
        shell: pwsh
        run: |
          .\BatchCreateBlogs.ps1

      - name: Run QAValidator.ps1
        shell: pwsh
        run: |
          .\QAValidator.ps1

      - name: Upload QA Report
        uses: actions/upload-artifact@v4
        with:
          name: QAReport
          path: QAReport.txt

      - name: Upload site folder
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  deploy:
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
