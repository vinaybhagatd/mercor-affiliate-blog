name: MABS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger

permissions:
  contents: write      # allow creating releases, pushing artifacts
  pages: write         # allow deployment to GitHub Pages
  id-token: write      # Required for OIDC authentication purpose

jobs:
  build-and-validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'   # required for some PowerShell modules

      - name: Run BatchCreateBlogs.ps1
        shell: pwsh
        run: |
          .\BatchCreateBlogs.ps1

      - name: Run QAValidator.ps1
        shell: pwsh
        run: |
          .\QAValidator.ps1

      - name: Upload QA Report
        uses: actions/upload-artifact@v4
        with:
          name: QAReport
          path: QAReport.txt
      
  deploy:
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: success()   # only run if validation passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
